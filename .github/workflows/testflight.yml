# Signed internal TestFlight delivery for iOS, macOS and tvOS, in parallel.
#
#   push a v* tag     → lane release → TestFlight, marketing version = the tag
#   manual (Actions)  → lane beta    → TestFlight, auto build number
#
# TestFlight is release-gated: a build ships only when you cut a v* tag, so every
# TestFlight build is a deliberate, changelog-able release. Merges to develop run
# only the compile-only build-check (see build-check.yml), not a TestFlight build.
#
# Required repo (or org) secrets — identical for every app except BUNDLE_ID_PREFIX:
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_CONTENT (base64 of the .p8 — upload rights suffice here; only the
#   one-time bootstrap needs ADMIN to create certificates), APPLE_TEAM_ID, BUNDLE_ID_PREFIX
#   B2_SIGNING_KEY_ID, B2_SIGNING_APP_KEY (a READ-ONLY key scoped to one bucket), B2_SIGNING_ENDPOINT,
#   B2_SIGNING_BUCKET, SIGNING_PASSPHRASE (decrypts the signing bundle and its .p12 files)
# (scripts/setup-secrets.sh sets all of them; scripts/bootstrap-signing.py creates and uploads the
# signing bundle once per team/app.)
#
# Signing: the bundle holds one shared Apple Distribution certificate, the Mac installer certificate and
# an App Store profile per platform; fastlane imports it into a throwaway keychain and signs manually,
# so a fresh runner never mints a certificate (see fastlane/Fastfile).
name: TestFlight

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: testflight-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The Rust core (ADR-003), built once for every Apple slice and handed to the app builds:
  # build/BudCoreFFI.xcframework and build/BudCore/BudCore.swift from scripts/build-core.sh.
  core:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      # tvOS is a tier 3 target: its slices need nightly with the standard library from source.
      - name: Install nightly Rust for tvOS
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Install stable Rust for macOS and iOS
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin, aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - name: Build the core
        run: scripts/build-core.sh
      - uses: actions/upload-artifact@v4
        with:
          name: core-${{ github.sha }}
          path: build/
          if-no-files-found: error
          retention-days: 7

  testflight:
    needs: core
    strategy:
      fail-fast: false        # one platform's hiccup must not block the others
      matrix:
        platform: [ios, mac, tvos]
    runs-on: macos-26         # iOS 26 SDK; Xcode also carries the iOS 17 / macOS 14 SDKs
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Write signing config (gitignored, from secrets)
        run: |
          cat > Config/BundleIdSecrets.xcconfig <<EOF
          BUNDLE_ID_PREFIX = ${{ secrets.BUNDLE_ID_PREFIX }}
          DEVELOPMENT_TEAM = ${{ secrets.APPLE_TEAM_ID }}
          EOF

      - name: Resolve app id + lane + version
        id: plan
        run: |
          SLUG=$(grep -E '^[[:space:]]*APP_SLUG[[:space:]]*=' Config/BundleId.xcconfig | tail -1 | sed -E 's/.*=[[:space:]]*//' | tr -d '[:space:]')
          echo "app_bundle_id=${{ secrets.BUNDLE_ID_PREFIX }}.${SLUG}" >> "$GITHUB_OUTPUT"
          echo "app_slug=${SLUG}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "lane=release" >> "$GITHUB_OUTPUT"
            echo "marketing=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "lane=beta" >> "$GITHUB_OUTPUT"
            echo "marketing=" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch the core
        uses: actions/download-artifact@v4
        with:
          name: core-${{ github.sha }}
          path: build/

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Pull the encrypted signing bundle with a READ-ONLY, single-bucket key and decrypt it into a
      # temp dir. Two objects: team/certs.tar.enc (shared certificates) and <slug>/profiles.tar.enc
      # (this app's App Store profiles). The listing prints file names only.
      - name: Fetch signing bundle (read-only object-storage key)
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.B2_SIGNING_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_SIGNING_APP_KEY }}
          ENDPOINT:              ${{ secrets.B2_SIGNING_ENDPOINT }}
          BUCKET:                ${{ secrets.B2_SIGNING_BUCKET }}
          SIGNING_PASSPHRASE:    ${{ secrets.SIGNING_PASSPHRASE }}
          SLUG:                  ${{ steps.plan.outputs.app_slug }}
          # S3-compatible stores have rejected the CLI's newer default checksum headers; send them
          # only when an operation requires them.
          AWS_REQUEST_CHECKSUM_CALCULATION:   when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION:   when_required
        run: |
          set -euo pipefail
          command -v aws >/dev/null || brew install awscli
          REGION="${ENDPOINT#s3.}"; REGION="${REGION%%.*}"        # s3.<region>.<host> → <region>
          DIR="$RUNNER_TEMP/signing"; mkdir -p "$DIR"
          for key in "team/certs.tar.enc" "${SLUG}/profiles.tar.enc"; do
            aws s3 cp "s3://${BUCKET}/${key}" "$DIR/blob.enc" \
              --endpoint-url "https://${ENDPOINT}" --region "$REGION" --only-show-errors
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$DIR/blob.enc" \
              -pass env:SIGNING_PASSPHRASE | tar -x -C "$DIR"
            rm -f "$DIR/blob.enc"
          done
          find "$DIR" -type f | sed "s|$DIR/|  |"
          echo "SIGNING_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Set up Ruby + fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Deliver to TestFlight (${{ matrix.platform }})
        env:
          ASC_KEY_ID:            ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID:         ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT:       ${{ secrets.ASC_KEY_CONTENT }}
          APPLE_TEAM_ID:         ${{ secrets.APPLE_TEAM_ID }}
          APP_BUNDLE_ID:         ${{ steps.plan.outputs.app_bundle_id }}
          APP_MARKETING_VERSION: ${{ steps.plan.outputs.marketing }}
          APP_CHANGELOG:         "Build from ${{ github.ref_name }} @ ${{ github.sha }}"
          SIGNING_PASSPHRASE:    ${{ secrets.SIGNING_PASSPHRASE }}   # SIGNING_DIR comes from the fetch step
        run: bundle exec fastlane ${{ matrix.platform }} ${{ steps.plan.outputs.lane }}
