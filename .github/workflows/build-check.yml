# Compile gate — builds every app (no signing, no secrets) on PRs so a broken change can't merge.
name: Build check

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            scheme: "Bud iOS"
            destination: "generic/platform=iOS"
          - platform: macOS
            scheme: "Bud macOS"
            destination: "generic/platform=macOS"
          - platform: tvOS
            scheme: "Bud tvOS"
            destination: "generic/platform=tvOS"
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build ${{ matrix.platform }} (no signing)
        run: >-
          xcodebuild -project Bud.xcodeproj -scheme "${{ matrix.scheme }}" -configuration Debug
          -destination '${{ matrix.destination }}'
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

  # Pictures, not a gate: the canvas rendered in light and dark, attached to the run so a change can
  # be looked at before it merges. Never required by the ruleset.
  snapshots:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Render the canvas
        env:
          BUD_SNAPSHOT_DIR: ${{ runner.temp }}/snapshots
        run: swift test --filter BudKitSnapshots
      # The store's tests need SwiftUI, so the Linux gate cannot run them.
      - name: Test the store over a vault
        run: swift test --filter 'StoreVaultTests|StorePathTests'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canvas-${{ github.sha }}
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: error
