# Compile gate — builds every app (no signing, no secrets) on PRs so a broken change can't merge.
name: Build check

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The Rust core (ADR-003), built once for every Apple slice and handed to the app builds:
  # build/BudCoreFFI.xcframework and build/BudCore/BudCore.swift from scripts/build-core.sh.
  core:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      # tvOS is a tier 3 target: its slices need nightly with the standard library from source.
      - name: Install nightly Rust for tvOS
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Install stable Rust for macOS and iOS
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin, aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - name: Build the core
        run: scripts/build-core.sh
      - uses: actions/upload-artifact@v4
        with:
          name: core-${{ github.sha }}
          path: build/
          if-no-files-found: error
          retention-days: 7

  build:
    needs: core
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            scheme: "Bud iOS"
            destination: "generic/platform=iOS"
          - platform: macOS
            scheme: "Bud macOS"
            destination: "generic/platform=macOS"
          - platform: tvOS
            scheme: "Bud tvOS"
            destination: "generic/platform=tvOS"
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Fetch the core
        uses: actions/download-artifact@v4
        with:
          name: core-${{ github.sha }}
          path: build/
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build ${{ matrix.platform }} (no signing)
        run: >-
          xcodebuild -project Bud.xcodeproj -scheme "${{ matrix.scheme }}" -configuration Debug
          -destination '${{ matrix.destination }}'
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

  # Pictures, not a gate: the canvas rendered in light and dark, attached to the run so a change can
  # be looked at before it merges. Never required by the ruleset.
  snapshots:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Render the canvas
        env:
          BUD_SNAPSHOT_DIR: ${{ runner.temp }}/snapshots
        run: swift test --filter BudKitSnapshots
      - uses: actions/upload-artifact@v4
        with:
          name: canvas-${{ github.sha }}
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: error
