# The Linux gate: the Rust core and the Swift targets that never import SwiftUI, tested on a cheap
# runner on every pull request. The apps themselves compile in build-check.yml on macOS.
name: Gate

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install curl for the Rust installer and a C compiler for the bundled SQLite
        run: apt-get update -q && apt-get install -y -q --no-install-recommends curl ca-certificates build-essential
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: swift build
        run: swift build
      - name: swift test
        run: swift test
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace
