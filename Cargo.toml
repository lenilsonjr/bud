# The Rust side of Bud (ADR-003): the core that owns the vault on disk and its SQLite index.
[workspace]
members = ["core/bud-core", "core/bud-ffi"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/lenilsonjr/bud"

[workspace.lints.clippy]
all = "warn"

# Two crates under iroh stop compiling for iOS and tvOS with libc 0.2.190 and later, which
# moved the Apple routing-socket and interface definitions behind a macOS-only gate, and neither
# has a tvOS target at all:
# - netdev 0.46.3 is patched to its upstream iOS fix plus tvOS treated like iOS (public APIs
#   only; still version 0.46.3, since netwatch does not take 0.47 yet);
# - netwatch 0.19.3 is patched to treat tvOS like iOS; it has no libc fix yet, so Cargo.lock pins
#   libc at 0.2.189, the last release that defines those symbols for every Apple target. Do not
#   bump libc until netwatch gates them.
# Both patches sit on branches of forks until they land upstream.
[patch.crates-io]
netdev = { git = "https://github.com/lenilsonjr/netdev", rev = "232667d55df63d80398f4628bc04888327fb7c66" }
netwatch = { git = "https://github.com/lenilsonjr/net-tools", rev = "a228a0bdaa056ff2f9e0dd192a43dc09037932d9" }
