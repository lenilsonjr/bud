# The Rust side of Bud (ADR-003): the core that owns the vault on disk and its SQLite index.
[workspace]
members = ["core/bud-core", "core/bud-ffi"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/lenilsonjr/bud"

[workspace.lints.clippy]
all = "warn"

# Two crates under iroh stop compiling for iOS and tvOS with libc 0.2.190 and later, which
# moved the Apple routing-socket and interface definitions behind a macOS-only gate:
# - netdev 0.46.3 is patched to its upstream iOS fix (public APIs only; still version 0.46.3,
#   since netwatch does not take 0.47 yet);
# - netwatch 0.19.3 has no fix yet, so Cargo.lock pins libc at 0.2.189, the last release that
#   defines those symbols for every Apple target. Do not bump libc until netwatch gates them.
[patch.crates-io]
netdev = { git = "https://github.com/shellrow/netdev", rev = "b3bfb0fb5595cd143bfa0b9f07d1ad6e0ef0c313" }
