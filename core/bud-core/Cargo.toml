[package]
name = "bud-core"
description = "A vault is a folder of Markdown files; SQLite is the index that follows it."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chacha20poly1305 = "0.10"
data-encoding = "2"
diff = "0.1"
getrandom = "0.3"
iroh = "1"
iroh-mdns-address-lookup = "0.6"
loro = "1"
notify = "8"
postcard = { version = "1", features = ["use-std"] }
qrcode = { version = "0.14", default-features = false }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
walkdir = "2"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"

[lints]
workspace = true
