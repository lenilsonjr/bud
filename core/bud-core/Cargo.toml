[package]
name = "bud-core"
description = "A vault is a folder of Markdown files; SQLite is the index that follows it."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
diff = "0.1"
loro = "1"
notify = "8"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2"
walkdir = "2"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"

[lints]
workspace = true
