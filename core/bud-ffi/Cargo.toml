[package]
name = "bud-ffi"
description = "The vault of bud-core exposed to Swift over UniFFI."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "bud_ffi"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
bud-core = { path = "../bud-core" }
thiserror = "2"
uniffi = { version = "0.29", features = ["cli"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
