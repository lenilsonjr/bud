name: Bud
options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    tvOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
# One place defines BUNDLE_ID_PREFIX / APP_SLUG / DEVELOPMENT_TEAM, inherited by every target.
configFiles:
  Debug: Config/BundleId.xcconfig
  Release: Config/BundleId.xcconfig
# The app targets consume the local BudKit Swift package (Package.swift at the repo root) — the model,
# layout, and SwiftUI views are shared verbatim, never copied.
# Each app also compiles the Rust core's Swift bindings and links its XCFramework, both made by
# scripts/build-core.sh into build/ (run it once before xcodegen; CI does). The bindings share
# names with BudKit's types, which is why they are not a module of their own: see App/RustVault.swift.
packages:
  BudKit:
    path: .
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic         # local Xcode work; CI overrides to Manual on the command line
    GENERATE_INFOPLIST_FILE: NO
    # Same bundle id across platforms → one unified App Store Connect record (iOS + macOS enabled).
    PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).$(APP_SLUG)
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  Bud-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - App
      - Resources/Assets.xcassets
      - build/BudCore/BudCore.swift
    settings:
      base:
        PRODUCT_NAME: Bud
        TARGETED_DEVICE_FAMILY: "1,2"     # iPhone + iPad
    dependencies:
      - package: BudKit
        product: BudKit
      - framework: build/BudCoreFFI.xcframework
        embed: false
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
      - sdk: Network.framework
    info:
      path: Resources/Info-iOS.plist
      properties:
        CFBundleName: Bud
        CFBundleDisplayName: Bud
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Baked in so TestFlight never shows a Missing-Compliance gate (no non-exempt crypto).
        ITSAppUsesNonExemptEncryption: false
        # The join sheet scans a ticket's QR code; App Store Connect turns away a package that
        # links the camera without this purpose string (ITMS-90683).
        NSCameraUsageDescription: Bud uses the camera to scan the ticket shown by a device that already has the vault.
        # The vault is a folder of Markdown files in Documents, shown in the Files app.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSLocalNetworkUsageDescription: Bud finds your other devices on this network to keep the vault in sync.
  Bud-macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - App
      - Resources/Assets.xcassets
      - build/BudCore/BudCore.swift
    entitlements:
      path: Resources/Bud-macOS.entitlements
      properties:
        # App Sandbox is mandatory for Mac App Store / TestFlight. The vault lives in the app's own
        # container, so no file entitlements are needed; syncing with the other devices needs the
        # network both ways.
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
    settings:
      base:
        PRODUCT_NAME: Bud
        ENABLE_HARDENED_RUNTIME: YES       # required alongside sandbox for distribution
    dependencies:
      - package: BudKit
        product: BudKit
      - framework: build/BudCoreFFI.xcframework
        embed: false
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
      - sdk: Network.framework
    info:
      path: Resources/Info-macOS.plist
      properties:
        CFBundleName: Bud
        CFBundleDisplayName: Bud
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: ""
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Bud finds your other devices on this network to keep the vault in sync.
  Bud-tvOS:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - App
      - Resources/Assets.xcassets
      - build/BudCore/BudCore.swift
    settings:
      base:
        PRODUCT_NAME: Bud
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
    dependencies:
      - package: BudKit
        product: BudKit
      - framework: build/BudCoreFFI.xcframework
        embed: false
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
      - sdk: Network.framework
    info:
      path: Resources/Info-tvOS.plist
      properties:
        CFBundleName: Bud
        CFBundleDisplayName: Bud
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.productivity
        UIUserInterfaceStyle: Automatic
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Bud finds your other devices on this network to keep the vault in sync.
schemes:
  Bud iOS:
    build:
      targets:
        Bud-iOS: all
    run:
      config: Debug
    archive:
      config: Release
  Bud macOS:
    build:
      targets:
        Bud-macOS: all
    run:
      config: Debug
    archive:
      config: Release
  Bud tvOS:
    build:
      targets:
        Bud-tvOS: all
    run:
      config: Debug
    archive:
      config: Release
